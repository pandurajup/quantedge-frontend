<!DOCTYPE html>
<html>
<head>
  <title>QuantEdge AI</title>
</head>
<body style="text-align:center; margin-top:50px; font-family:sans-serif;">

  <h1>🚀 QuantEdge AI – PN Labs</h1>

  <input id="symbol" value="AAPL" style="padding:10px;" />
  <br><br>

  <button onclick="getPrediction()" style="padding:10px 20px;">
    Get Prediction
  </button>

  <br><br>

  <div id="result"></div>

  <script>
    async function getPrediction() {
      const symbol = document.getElementById("symbol").value;

      const res = await fetch(
        `https://quantedge-api-ob90.onrender.com/predict/${symbol}`
      );

      const data = await res.json();

      document.getElementById("result").innerHTML = `
        <h2>Prediction: ${data.prediction}</h2>
        <p>Confidence: ${data.confidence}%</p>
        <p>Source: ${data.source}</p>
        <p>Trend: ${data.reason.trend}</p>
        <p>Volatility: ${data.reason.volatility}</p>
      `;
    }
  </script>

</body>
</html>
