<!DOCTYPE html>
<html>
<head>
  <title>QuantEdge AI</title>
  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 40px;
    }

    h1 {
      color: #38bdf8;
    }

    input {
      padding: 10px;
      width: 200px;
      border-radius: 5px;
      border: none;
    }

    button {
      padding: 10px 20px;
      background: #38bdf8;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .card {
      margin-top: 30px;
      padding: 20px;
      border-radius: 10px;
      background: #1e293b;
      display: inline-block;
      min-width: 300px;
    }

    .buy { color: #22c55e; }
    .sell { color: #ef4444; }
    .hold { color: #facc15; }
  </style>
</head>

<body>

  <h1>🚀 QuantEdge AI – PN Labs</h1>

  <input id="symbol" value="AAPL" />
  <br><br>

  <button onclick="getPrediction()">Get Prediction</button>

  <div id="result"></div>

  <script>
    async function getPrediction() {
      const symbol = document.getElementById("symbol").value;

      const res = await fetch(
        `https://quantedge-api-ob90.onrender.com/predict/${symbol}`
      );

      const data = await res.json();

      let colorClass = "hold";
      if (data.prediction === "BUY") colorClass = "buy";
      if (data.prediction === "SELL") colorClass = "sell";

      document.getElementById("result").innerHTML = `
        <div class="card">
          <h2 class="${colorClass}">${data.prediction}</h2>
          <p>Confidence: ${data.confidence}%</p>
          <p>Source: ${data.source}</p>
          <hr>
          <p>Trend: ${data.reason.trend}</p>
          <p>Volatility: ${data.reason.volatility}</p>
        </div>
      `;
    }
  </script>

</body>
</html>
