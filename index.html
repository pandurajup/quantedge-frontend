<!DOCTYPE html>
<html>
<head>
  <title>QuantEdge AI – PN Labs</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    <div id="auth">
  <h2>Login / Signup</h2>

  <input id="username" placeholder="Username">
  <input id="password" type="password" placeholder="Password">

  <button onclick="signup()">Signup</button>
  <button onclick="login()">Login</button>

  <p id="auth-msg"></p>
</div>
<script>
async function signup() {
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;

  const res = await fetch(API + "/signup", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({username, password})
  });

  const data = await res.json();
  document.getElementById("auth-msg").innerText = data.message || data.error;
}

async function login() {
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;

  const res = await fetch(API + "/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({username, password})
  });

  const data = await res.json();

  if (data.token) {
    localStorage.setItem("token", data.token);
    document.getElementById("auth").style.display = "none";
    alert("Login successful 🚀");
  } else {
    document.getElementById("auth-msg").innerText = data.error;
  }
}
</script>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #020617, #0f172a);
      color: white;
      display: flex;
    }

    /* SIDEBAR */
    .sidebar {
      width: 220px;
      background: #020617;
      padding: 20px;
      border-right: 1px solid #1e293b;
      height: 100vh;
    }

    .sidebar h2 {
      color: #38bdf8;
    }

    .sidebar button {
      width: 100%;
      margin: 10px 0;
      padding: 10px;
      background: #1e293b;
      border: none;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }

    .sidebar button:hover {
      background: #38bdf8;
      color: black;
    }

    /* MAIN CONTENT */
    .main {
      flex: 1;
      padding: 20px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    input {
      padding: 10px;
      border-radius: 8px;
      border: none;
      width: 200px;
    }

    button.primary {
      padding: 10px 20px;
      background: #38bdf8;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    /* KPI CARDS */
    .kpi-container {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }

    .kpi {
      flex: 1;
      background: rgba(30,41,59,0.6);
      backdrop-filter: blur(10px);
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }

    .kpi h2 {
      margin: 5px 0;
    }

    .buy { color: #22c55e; }
    .sell { color: #ef4444; }
    .hold { color: #facc15; }

    /* CHART */
    .chart-box {
      background: rgba(30,41,59,0.6);
      padding: 20px;
      border-radius: 12px;
    }

    /* CARDS GRID */
    #result {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: rgba(30,41,59,0.7);
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }

  </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>🚀 QuantEdge</h2>
  <button onclick="loadStocks()">📊 Top Stocks</button>
  <button onclick="loadPortfolio()">💰 Portfolio</button>
</div>

<!-- MAIN -->
<div class="main">

  <div class="topbar">
    <input id="symbol" value="AAPL">
    <button class="primary" onclick="getPrediction()">Analyze</button>
  </div>

  <!-- KPI -->
  <div class="kpi-container">
    <div class="kpi">
      <h4>Prediction</h4>
      <h2 id="pred">-</h2>
    </div>
    <div class="kpi">
      <h4>Confidence</h4>
      <h2 id="conf">-</h2>
    </div>
    <div class="kpi">
      <h4>Sentiment</h4>
      <h2 id="sent">-</h2>
    </div>
  </div>

  <!-- CHART -->
  <div class="chart-box">
    <canvas id="chart"></canvas>
  </div>

  <!-- RESULTS -->
  <div id="result"></div>

</div>

<script>
const API = "https://quantedge-api-ob90.onrender.com";
let chartInstance = null;

/* UPDATE KPI */
function updateKPI(data) {
  document.getElementById("pred").innerText = data.prediction;
  document.getElementById("pred").className = data.prediction.toLowerCase();

  document.getElementById("conf").innerText = data.confidence + "%";
  document.getElementById("sent").innerText = data.sentiment;
}

/* PREDICTION */
async function getPrediction() {
  const symbol = document.getElementById("symbol").value;

  const res = await fetch(`${API}/predict/${symbol}`);
  const data = await res.json();

  updateKPI(data);
  loadChart(symbol);
}

/* TOP STOCKS */
async function loadStocks() {
  const stocks = ["AAPL","TSLA","RELIANCE.NS","TCS.NS","INFY.NS"];
  let html = "";

  for (let s of stocks) {
    const res = await fetch(`${API}/predict/${s}`);
    const d = await res.json();

    html += `<div class="card">
      <h3>${s}</h3>
      <h2 class="${d.prediction.toLowerCase()}">${d.prediction}</h2>
      <p>${d.confidence}%</p>
    </div>`;
  }

  document.getElementById("result").innerHTML = html;
}

/* PORTFOLIO */
async function loadPortfolio() {
  const res = await fetch(`${API}/portfolio`);
  const data = await res.json();

  let html = "<h2>Portfolio</h2>";

  data.portfolio.forEach(p => {
    html += `<div class="card">
      <h3>${p.symbol}</h3>
      <p>${p.allocation}%</p>
    </div>`;
  });

  document.getElementById("result").innerHTML = html;
}

/* CHART */
async function loadChart(symbol="AAPL") {
  const res = await fetch(`${API}/chart/${symbol}`);
  const data = await res.json();

  const ctx = document.getElementById("chart").getContext("2d");

  if (chartInstance) chartInstance.destroy();

  const gradient = ctx.createLinearGradient(0,0,0,300);
  gradient.addColorStop(0,"#38bdf8");
  gradient.addColorStop(1,"transparent");

  chartInstance = new Chart(ctx, {
    type: "line",
    data: {
      labels: data.dates,
      datasets: [{
        data: data.prices,
        borderColor: "#38bdf8",
        backgroundColor: gradient,
        fill: true,
        tension: 0.3
      }]
    },
    options: {
      plugins: { legend: { display: false }},
      scales: {
        x: { ticks: { color: "white" }},
        y: { ticks: { color: "white" }}
      }
    }
  });
}
</script>

</body>
</html>
