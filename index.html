<!DOCTYPE html>
<html>
<head>
  <title>QuantEdge AI – PN Labs</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #020617, #0f172a);
      color: white;
      display: flex;
    }

    /* LOGIN BOX */
    #auth {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 1000;
    }

    #auth input {
      margin: 10px;
      padding: 10px;
      width: 200px;
      border-radius: 8px;
      border: none;
    }

    #auth button {
      padding: 10px 20px;
      margin: 5px;
      background: #38bdf8;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    /* SIDEBAR */
    .sidebar {
      width: 220px;
      background: #020617;
      padding: 20px;
      border-right: 1px solid #1e293b;
      height: 100vh;
    }

    .sidebar h2 { color: #38bdf8; }

    .sidebar button {
      width: 100%;
      margin: 10px 0;
      padding: 10px;
      background: #1e293b;
      border: none;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }

    .main {
      flex: 1;
      padding: 20px;
    }

    .kpi-container {
      display: flex;
      gap: 20px;
    }

    .kpi {
      flex: 1;
      background: rgba(30,41,59,0.6);
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }

    .chart-box {
      margin-top: 20px;
      background: rgba(30,41,59,0.6);
      padding: 20px;
      border-radius: 12px;
    }

    #result {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: rgba(30,41,59,0.7);
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }

    .buy { color: #22c55e; }
    .sell { color: #ef4444; }
  </style>
</head>

<body>

<!-- LOGIN UI -->
<div id="auth">
  <h2>Login / Signup</h2>
  <input id="username" placeholder="Username">
  <input id="password" type="password" placeholder="Password">
  <button onclick="signup()">Signup</button>
  <button onclick="login()">Login</button>
  <p id="auth-msg"></p>
</div>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>🚀 QuantEdge</h2>
  <button onclick="loadStocks()">Top Stocks</button>
  <button onclick="loadPortfolio()">Portfolio</button>
</div>

<!-- MAIN -->
<div class="main">

  <input id="symbol" value="AAPL">
  <button onclick="getPrediction()">Analyze</button>

  <div class="kpi-container">
    <div class="kpi"><h3 id="pred">-</h3></div>
    <div class="kpi"><h3 id="conf">-</h3></div>
    <div class="kpi"><h3 id="sent">-</h3></div>
  </div>

  <div class="chart-box">
    <canvas id="chart"></canvas>
  </div>

  <div id="result"></div>

</div>

<script>
const API = "https://quantedge-api-ob90.onrender.com";
let chartInstance = null;

/* AUTH */
async function signup() {
  const username = usernameInput();
  const password = passwordInput();

  const res = await fetch(API + "/signup", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({username, password})
  });

  const data = await res.json();
  msg(data);
}

async function login() {
  const username = usernameInput();
  const password = passwordInput();

  const res = await fetch(API + "/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({username, password})
  });

  const data = await res.json();

  if (data.token) {
    localStorage.setItem("token", data.token);
    document.getElementById("auth").style.display = "none";
    alert("Login successful 🚀");
  } else {
    msg(data);
  }
}

function usernameInput() {
  return document.getElementById("username").value;
}

function passwordInput() {
  return document.getElementById("password").value;
}

function msg(data) {
  document.getElementById("auth-msg").innerText = data.message || data.error;
}

/* PREDICTION */
async function getPrediction() {
  const symbol = document.getElementById("symbol").value;

  const res = await fetch(`${API}/predict/${symbol}`);
  const data = await res.json();

  document.getElementById("pred").innerText = data.prediction;
  document.getElementById("conf").innerText = data.confidence + "%";
  document.getElementById("sent").innerText = data.sentiment;

  loadChart(symbol);
}

/* CHART */
async function loadChart(symbol="AAPL") {
  const res = await fetch(`${API}/chart/${symbol}`);
  const data = await res.json();

  const ctx = document.getElementById("chart").getContext("2d");

  if (chartInstance) chartInstance.destroy();

  chartInstance = new Chart(ctx, {
    type: "line",
    data: {
      labels: data.dates,
      datasets: [{
        data: data.prices,
        borderColor: "#38bdf8",
        fill: true,
        tension: 0.3
      }]
    }
  });
}
</script>

</body>
</html>
